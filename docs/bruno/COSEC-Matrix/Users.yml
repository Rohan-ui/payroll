info:
  name: Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{cosecBaseUrl}}/user?action=get;range=all;format=json"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: action
      value: get;range=all;format=json
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
