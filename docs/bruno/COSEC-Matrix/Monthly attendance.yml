info:
  name: Monthly attendance
  type: http
  seq: 2
  description: Month summary for everyone. monthYear is MMYYYY, e.g. 112026.
http:
  method: GET
  url: '{{cosecBaseUrl}}/attendance-monthly?action=get;range=all;month-year={{monthYear}};format=json'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
settings:
  encodeUrl: false
